<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shikela - Admin News Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-slate: #0f172a;
            --primary-accent: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 50%, #312e81 100%);
            --accent-glow: rgba(79, 70, 229, 0.15);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-light: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fafbfc;
            background-image: radial-gradient(rgba(148, 163, 184, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--primary-accent);
            font-weight: 800;
            text-decoration: none;
            font-size: 13.5px;
            background: #ffffff;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s ease;
        }
        .back-link:active { transform: scale(0.96); }

        .toast-banner {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            padding: 12px 20px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 2500;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.12);
        }

        .modal-title { font-size: 17px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .modal-data-row { display: flex; justify-content: space-between; margin: 10px 0; background: var(--bg-light); padding: 10px; border-radius: 8px; font-size: 13px; }
        .modal-data-label { color: var(--text-muted); font-weight: 600; }
        .modal-data-value { font-weight: 800; color: var(--primary-accent); word-break: break-all; }

        /* Workspace Container */
        .workspace-card {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            padding: 24px;
            box-shadow: var(--card-shadow);
            margin: 0 auto;
        }

        .header-brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 16px;
        }

        .brand-title-group { display: flex; align-items: center; gap: 12px; }
        .brand-logo-img { width: 32px; height: 32px; object-fit: contain; }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-slate);
        }

        .editing-banner {
            display: none;
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed #f59e0b;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: #b45309;
            margin-bottom: 16px;
            justify-content: space-between;
            align-items: center;
        }

        .input-field-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            transition: opacity 0.2s ease;
        }

        .input-field-wrapper label {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-select, .admin-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-dark);
            background-color: var(--bg-light);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-select:focus, .admin-input:focus {
            border-color: var(--primary-accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .admin-input:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        textarea.admin-input {
            min-height: 90px;
            resize: vertical;
        }

        .image-preview-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-light);
            border: 1px dashed var(--border-light);
            border-radius: 12px;
            padding: 12px;
            margin-top: 6px;
        }

        .preview-img-element {
            max-height: 180px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }

        .duplicate-toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }

        .btn-admin-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s;
        }
        .btn-admin-action:active { transform: scale(0.97); }

        .btn-broadcast {
            flex: 1;
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-delete {
            background: var(--danger-gradient);
            color: #ffffff;
        }

        .btn-modal-close {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 1px solid var(--border-light);
        }

        .filter-btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-btn {
            padding: 8px 6px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            background: var(--bg-light);
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .filter-btn.active {
            background: var(--primary-accent);
            color: #ffffff;
            border-color: var(--primary-accent);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .manage-news-card {
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .manage-news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .manage-btn-group {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .btn-news-ctrl {
            flex: 1;
            padding: 8px 10px;
            font-size: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn-news-ctrl:active { opacity: 0.8; }

        .btn-ctrl-edit { background: rgba(245, 158, 11, 0.15); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-ctrl-preview { background: rgba(59, 130, 246, 0.15); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.3); }
        .btn-ctrl-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

        .cancel-edit-btn {
            background: none;
            border: none;
            color: #b45309;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }

        .code-badge {
            background: #ffffff;
            color: #475569;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 11px;
            border: 1px solid var(--border-light);
            display: inline-block;
        }

        .node-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .node-tag-shikela { background: #e0e7ff; color: #3730a3; }
        .node-tag-legacy { background: #e2e8f0; color: #475569; }
    </style>
</head>
<body>

    <div class="toast-banner" id="adminToast">Action Completed Successfully</div>

    <div class="modal-overlay" id="customConfirmModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitleDisplay">Confirm Request</h3>
            <p id="modalDescriptionDisplay" style="font-size:13px; color:var(--text-muted); margin-bottom: 12px;"></p>
            <div id="modalDynamicDetails"></div>
            <div class="btn-row" style="margin-top: 16px;">
                <button class="btn-admin-action btn-modal-close" id="modalCancelBtn">Cancel</button>
                <button class="btn-admin-action" id="modalConfirmBtn">Proceed</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewNewsModal">
        <div class="modal-box" style="max-width: 500px;">
            <h3 class="modal-title" id="previewModalTitle">Article Preview</h3>
            <div id="previewModalDetails" style="margin-top: 12px; max-height: 70vh; overflow-y: auto;"></div>
            <div class="btn-row" style="margin-top: 16px;">
                <button class="btn-admin-action btn-modal-close" style="width: 100%;" id="closePreviewBtn">Close Preview</button>
            </div>
        </div>
    </div>

    <div class="workspace-card">
        <a href="new.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>

        <div class="header-brand-row">
            <div class="brand-title-group">
                <img class="brand-logo-img" src="shikela-logo.png" alt="Shikela Logo" onerror="this.style.display='none'">
                <h3 class="section-title">Shikela News Manager & Editor</h3>
            </div>
        </div>

        <div class="editing-banner" id="editingBanner">
            <span>✏️ Mode: Editing Post (<strong id="editingNewsCode"></strong>)</span>
            <button class="cancel-edit-btn" id="cancelEditBtn">Cancel Edit</button>
        </div>
        
        <!-- 8 CATEGORY SELECTION -->
        <div class="input-field-wrapper">
            <label>Target Category</label>
            <select class="form-select" id="postCategory">
                <option value="Shikela Update">1. Shikela Update</option>
                <option value="Shikela Tips">2. Shikela Tips</option>
                <option value="Tech Update">3. Tech Update</option>
                <option value="Tech Tips">4. Tech Tips</option>
                <option value="Online Update">5. Online Update</option>
                <option value="Online Tips">6. Online Tips</option>
                <option value="Social Media">7. Social Media</option>
                <option value="Entertainment">8. Entertainment</option>
            </select>
        </div>

        <div id="standardFormFields">
            <div class="input-field-wrapper">
                <label>News Search Code</label>
                <input class="admin-input" type="text" id="newsCustomCode" placeholder="e.g. S-101 (Leave blank to auto-generate)" style="text-transform: uppercase;">
            </div>

            <div class="input-field-wrapper">
                <label>Title / Headline</label>
                <input class="admin-input" type="text" id="newsTitle" placeholder="e.g. Breaking Update">
            </div>

            <div class="input-field-wrapper">
                <label>Header Image URL (Optional)</label>
                <input class="admin-input" type="url" id="newsImageUrl" placeholder="https://example.com/banner.jpg">
                
                <div class="image-preview-box" id="imgPreviewBox">
                    <img id="liveImgElement" class="preview-img-element" src="" alt="Header Preview">
                    <label class="duplicate-toggle-row">
                        <input type="checkbox" id="duplicateImageToggle">
                        <span>Duplicate / Display image inside full article body as well</span>
                    </label>
                </div>
            </div>

            <div class="input-field-wrapper" id="videoUrlWrapper">
                <label id="videoUrlLabel">YouTube / Video URL (Optional)</label>
                <input class="admin-input" type="url" id="newsVideoUrl" placeholder="https://www.youtube.com/watch?v=XXXXX">
            </div>

            <div class="input-field-wrapper">
                <label>Content / Message Body</label>
                <textarea class="admin-input" id="newsMessage" placeholder="Type article content or update detail..."></textarea>
            </div>

            <div style="background: var(--bg-light); border: 1px solid var(--border-light); padding: 14px; border-radius: 12px; margin-bottom: 16px;">
                <p style="font-size: 11.5px; font-weight: 800; color: var(--primary-accent); text-transform: uppercase; margin-bottom: 10px;">
                    🔗 Action Link & Button (Optional)
                </p>
                <div class="input-field-wrapper">
                    <label>Target Action URL (Link)</label>
                    <input class="admin-input" type="url" id="newsRedirectUrl" placeholder="https://example.com or Leave Blank">
                </div>
                <div class="input-field-wrapper" style="margin-bottom: 0;">
                    <label>Action Button Label</label>
                    <input class="admin-input" type="text" id="newsButtonLabel" placeholder="e.g. Open Link, Read Full Story, Download Now">
                </div>
            </div>
        </div>

        <div class="btn-row" style="margin-bottom: 24px;">
            <button class="btn-admin-action btn-broadcast" id="publishNewsBtn">
                <span id="buttonText">Publish News Item</span>
            </button>
            <button class="btn-admin-action btn-delete" id="deleteAllCategoriesBtn" style="width: auto; padding: 0 16px;">Purge All News</button>
        </div>

        <div style="border-top: 1px dashed var(--border-light); padding-top:20px;">
            <h3 class="section-title" style="font-size: 16px; color: var(--text-dark); margin-bottom: 12px;">Manage News</h3>
            
            <!-- 8 CATEGORY FILTER BUTTONS -->
            <div class="filter-btn-grid">
            
                <button class="filter-btn" data-filter="Shikela Update">Shikela Update</button>
                <button class="filter-btn" data-filter="Shikela Tips">Shikela Tips</button>
                <button class="filter-btn" data-filter="Tech Update">Tech Update</button>
                <button class="filter-btn" data-filter="Tech Tips">Tech Tips</button>
                <button class="filter-btn" data-filter="Online Update">Online Update</button>
                <button class="filter-btn" data-filter="Online Tips">Online Tips</button>
                <button class="filter-btn" data-filter="Social Media">Social Media</button>
                <button class="filter-btn" data-filter="Entertainment">Entertainment</button>
            </div>

            <div id="manageNewsCardsContainer"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7BfMDuYQ",
            authDomain: "besuad.firebaseapp.com",
            databaseURL: "https://besuad-default-rtdb.firebaseio.com",
            projectId: "besuad",
            storageBucket: "besuad.firebasestorage.app",
            messagingSenderId: "641705823615",
            appId: "1:641705823615:web:6502b2511ff8c0f251de4a",
            measurementId: "G-2YSX71N08Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let res = null;
        let shikelaNewsState = {};
        let legacyNewsState = {};
        let currentEditingKey = null;
        let currentEditingNode = 'shikelaNews';
        let activeCategoryFilter = 'ALL';

        const imgUrlInput = document.getElementById('newsImageUrl');
        const imgPreviewBox = document.getElementById('imgPreviewBox');
        const liveImgElement = document.getElementById('liveImgElement');
        const duplicateImageToggle = document.getElementById('duplicateImageToggle');

        const videoUrlWrapper = document.getElementById('videoUrlWrapper');
        const newsVideoUrl = document.getElementById('newsVideoUrl');

        function extractYouTubeId(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.trim().match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        function updateImagePreview() {
            const url = imgUrlInput.value.trim();
            if (url.startsWith('http://') || url.startsWith('https://')) {
                liveImgElement.src = url;
                imgPreviewBox.style.display = 'flex';
            } else {
                imgPreviewBox.style.display = 'none';
                duplicateImageToggle.checked = false;
                duplicateImageToggle.dispatchEvent(new Event('change'));
            }
        }

        imgUrlInput.addEventListener('input', updateImagePreview);

        duplicateImageToggle.addEventListener('change', () => {
            if (duplicateImageToggle.checked) {
                videoUrlWrapper.style.opacity = '0.5';
                videoUrlWrapper.style.pointerEvents = 'none';
                newsVideoUrl.disabled = true;
                newsVideoUrl.value = '';
            } else {
                videoUrlWrapper.style.opacity = '1';
                videoUrlWrapper.style.pointerEvents = 'auto';
                newsVideoUrl.disabled = false;
            }
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategoryFilter = btn.getAttribute('data-filter');
                render();
            });
        });

        function openModal(t, d, m, c, tx) {
            document.getElementById('modalTitleDisplay').innerText = t; 
            document.getElementById('modalDescriptionDisplay').innerText = d;
            document.getElementById('modalDynamicDetails').innerHTML = `<div class="modal-data-row"><span class="modal-data-label">${m[0].label}</span><span class="modal-data-value">${m[0].value}</span></div>`;
            document.getElementById('modalConfirmBtn').className = "btn-admin-action " + c; 
            document.getElementById('modalConfirmBtn').innerText = tx;
            document.getElementById('customConfirmModal').classList.add('active'); 
            return new Promise(r => res = r);
        }
        
        document.getElementById('modalConfirmBtn').addEventListener('click', () => { if(res) res(true); document.getElementById('customConfirmModal').classList.remove('active'); });
        document.getElementById('modalCancelBtn').addEventListener('click', () => { if(res) res(false); document.getElementById('customConfirmModal').classList.remove('active'); });
        document.getElementById('closePreviewBtn').addEventListener('click', () => { document.getElementById('previewNewsModal').classList.remove('active'); });

        function triggerAdminAlert(m, s=true) {
            const t = document.getElementById('adminToast'); 
            t.innerText = m;
            t.style.background = s ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)' : 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
            t.style.display = 'block'; 
            setTimeout(() => t.style.display='none', 3500);
        }

        onValue(ref(db, 'shikelaNews'), snapshot => { 
            shikelaNewsState = snapshot.val() || {}; 
            render(); 
        }, error => console.error("Database 'shikelaNews' Connection Error:", error));

        onValue(ref(db, 'newNews'), snapshot => { 
            legacyNewsState = snapshot.val() || {}; 
            render(); 
        }, error => console.warn("Legacy Node Error:", error));

        function render() {
            const container = document.getElementById('manageNewsCardsContainer'); 
            container.innerHTML = ''; 
            
            const combined = [];

            Object.keys(shikelaNewsState).forEach(k => {
                combined.push({ key: k, node: 'shikelaNews', data: shikelaNewsState[k] });
            });

            Object.keys(legacyNewsState).forEach(k => {
                combined.push({ key: k, node: 'newNews', data: legacyNewsState[k] });
            });

            combined.sort((a, b) => (b.data.timestamp || 0) - (a.data.timestamp || 0));

            let renderedItemsCount = 0;

            combined.forEach(itemObj => { 
                const item = itemObj.data; 
                const k = itemObj.key;
                const nodeName = itemObj.node;
                const newsCode = item.newsCode || item.code || 'S-NONE';
                const tagClass = nodeName === 'shikelaNews' ? 'node-tag-shikela' : 'node-tag-legacy';
                const itemCategory = item.category || 'Shikela Update';

                let isMatch = false;
                if (activeCategoryFilter === 'ALL') isMatch = true;
                else if (itemCategory === activeCategoryFilter) isMatch = true;

                if (isMatch) {
                    renderedItemsCount++;
                    container.innerHTML += `
                        <div class="manage-news-card">
                            <div class="manage-news-header">
                                <div>
                                    <span class="code-badge">${newsCode}</span>
                                    <strong style="margin-left:6px; font-size:14px; color:var(--text-dark);">${item.title || item.newsTitle || 'Untitled'}</strong>
                                </div>
                                <span class="node-tag ${tagClass}">${nodeName}</span>
                            </div>
                            <div style="font-size:12px; color:var(--text-muted);">Category: <strong>${itemCategory}</strong></div>
                            <div class="manage-btn-group">
                                <button class="btn-news-ctrl btn-ctrl-edit edit-btn" data-key="${k}" data-node="${nodeName}">Edit News</button>
                                <button class="btn-news-ctrl btn-ctrl-preview preview-btn" data-key="${k}" data-node="${nodeName}">Preview News</button>
                                <button class="btn-news-ctrl btn-ctrl-delete del-btn" data-key="${k}" data-node="${nodeName}">Delete News</button>
                            </div>
                        </div>`; 
                }
            });

            if (renderedItemsCount === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-weight:600; font-size:13px;">No news items found for '${activeCategoryFilter}'.</div>`;
            }
            
            // Delete Handlers
            container.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', async () => {
                const k = btn.getAttribute('data-key');
                const nodeName = btn.getAttribute('data-node');
                const path = `${nodeName}/${k}`;

                if(!await openModal("Confirm Deletion", `Permanently remove entry from '${path}'?`, [{label:"Target:", value:path}], "btn-delete", "Delete Now")) return;
                try {
                    await remove(ref(db, path)); 
                    triggerAdminAlert("Entry deleted successfully!");
                    if(currentEditingKey === k) resetFormState();
                } catch(e) {
                    triggerAdminAlert("Deletion failed: " + e.message, false);
                }
            }));

            // Edit Handlers
            container.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => {
                const k = btn.getAttribute('data-key');
                const nodeName = btn.getAttribute('data-node');
                const item = (nodeName === 'shikelaNews') ? shikelaNewsState[k] : legacyNewsState[k];
                
                if(!item) return;

                currentEditingKey = k;
                currentEditingNode = nodeName;
                
                document.getElementById('postCategory').value = item.category || 'Shikela Update';
                document.getElementById('newsCustomCode').value = item.newsCode || item.code || '';
                document.getElementById('newsTitle').value = item.title || item.newsTitle || '';
                
                const imgUrl = item.imageUrl || item.image || '';
                document.getElementById('newsImageUrl').value = imgUrl;

                const isDuplicated = item.duplicateCoverInArticle === true || item.duplicateImageInArticle === true || item.duplicateImage === true;
                duplicateImageToggle.checked = isDuplicated;
                duplicateImageToggle.dispatchEvent(new Event('change'));

                document.getElementById('newsVideoUrl').value = item.videoUrl || item.youtubeUrl || '';
                document.getElementById('newsMessage').value = item.content || item.message || '';
                document.getElementById('newsRedirectUrl').value = item.link || item.redirectUrl || '';
                document.getElementById('newsButtonLabel').value = item.buttonLabel || item.actionButtonLabel || '';

                updateImagePreview();

                document.getElementById('editingBanner').style.display = 'flex';
                document.getElementById('editingNewsCode').innerText = `${item.newsCode || item.code || k} [${nodeName}]`;
                document.getElementById('buttonText').innerText = "Update Existing Post";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));

            // Preview Handler
            container.querySelectorAll('.preview-btn').forEach(btn => btn.addEventListener('click', () => {
                const k = btn.getAttribute('data-key');
                const nodeName = btn.getAttribute('data-node');
                const item = (nodeName === 'shikelaNews') ? shikelaNewsState[k] : legacyNewsState[k];

                if(!item) return;

                const imgUrl = item.imageUrl || item.image || '';
                const videoUrl = item.videoUrl || item.youtubeUrl || '';
                const ytId = item.youtubeId || extractYouTubeId(videoUrl);
                const isDupActive = item.duplicateCoverInArticle === true || item.duplicateImageInArticle === true || item.duplicateImage === true;

                const coverImgHtml = imgUrl ? `
                    <div style="margin-bottom:12px;">
                        <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">🖼️ Cover Header Image</span>
                        <img src="${imgUrl}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; border:1px solid var(--border-light); margin-top:4px;">
                    </div>` : '';

                let fullBodyMediaHtml = '';
                if (isDupActive && imgUrl) {
                    fullBodyMediaHtml = `
                        <div style="margin-top:12px;">
                            <span style="font-size:11px; font-weight:800; color:var(--primary-accent); text-transform:uppercase;">🖼️ Duplicated Full Body Image</span>
                            <img src="${imgUrl}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; border:1px solid var(--border-light); margin-top:4px;">
                        </div>`;
                } else if (ytId && ytId.length === 11) {
                    fullBodyMediaHtml = `
                        <div style="margin-top:12px;">
                            <span style="font-size:11px; font-weight:800; color:var(--primary-accent); text-transform:uppercase;">🎬 YouTube Video</span>
                            <iframe src="https://www.youtube.com/embed/${ytId}" style="width:100%; height:180px; border-radius:8px; border:none; margin-top:4px;" allowfullscreen></iframe>
                        </div>`;
                }

                document.getElementById('previewModalDetails').innerHTML = `
                    ${coverImgHtml}
                    <div class="modal-data-row"><span class="modal-data-label">Code:</span><span class="modal-data-value">${item.newsCode || item.code || 'N/A'}</span></div>
                    <div class="modal-data-row"><span class="modal-data-label">Title:</span><span class="modal-data-value">${item.title || item.newsTitle || 'Untitled'}</span></div>
                    <div class="modal-data-row"><span class="modal-data-label">Category:</span><span class="modal-data-value">${item.category || 'Shikela Update'}</span></div>
                    <div class="modal-data-row"><span class="modal-data-label">Video Link:</span><span class="modal-data-value">${videoUrl || 'Disabled / None'}</span></div>

                    <div style="background:var(--bg-light); padding:12px; border-radius:10px; margin-top:10px; font-size:13px; color:var(--text-dark); line-height:1.4;">
                        <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:4px;">📝 Full Article Body</span>
                        ${item.content || item.message || 'No content body provided.'}
                        ${fullBodyMediaHtml}
                    </div>
                `;
                document.getElementById('previewNewsModal').classList.add('active');
            }));
        }

        document.getElementById('cancelEditBtn').addEventListener('click', resetFormState);

        function resetFormState() {
            currentEditingKey = null;
            currentEditingNode = 'shikelaNews';
            document.getElementById('editingBanner').style.display = 'none';
            document.getElementById('buttonText').innerText = "Publish News Item";
            
            document.getElementById('postCategory').value = 'Shikela Update';
            document.getElementById('newsCustomCode').value = '';
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsImageUrl').value = '';
            document.getElementById('newsVideoUrl').value = '';
            document.getElementById('newsMessage').value = '';
            document.getElementById('newsRedirectUrl').value = '';
            document.getElementById('newsButtonLabel').value = '';

            duplicateImageToggle.checked = false;
            duplicateImageToggle.dispatchEvent(new Event('change'));

            updateImagePreview();
        }

        // Publish Action Handler
        document.getElementById('publishNewsBtn').addEventListener('click', async () => {
            const cat = document.getElementById('postCategory').value;
            const publishBtn = document.getElementById('publishNewsBtn');
            const buttonText = document.getElementById('buttonText');

            const nowEpoch = Date.now();
            const timestampFormatted = new Date().toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
            });

            publishBtn.disabled = true;

            const title = document.getElementById('newsTitle').value.trim();
            const imageUrl = document.getElementById('newsImageUrl').value.trim();
            const duplicateImage = duplicateImageToggle.checked;
            const videoUrl = duplicateImage ? '' : newsVideoUrl.value.trim();
            const youtubeId = extractYouTubeId(videoUrl);

            const message = document.getElementById('newsMessage').value.trim();
            const redirectUrl = document.getElementById('newsRedirectUrl').value.trim();
            const buttonLabel = document.getElementById('newsButtonLabel').value.trim();
            let newsCode = document.getElementById('newsCustomCode').value.trim().toUpperCase();

            if(!title || !message) {
                publishBtn.disabled = false;
                return triggerAdminAlert("Title and content message are required.", false);
            }

            if (!newsCode) {
                newsCode = `S-${Math.floor(1000 + Math.random() * 9000)}`;
            }
            
            buttonText.innerText = currentEditingKey ? "Updating..." : "Publishing...";

            const newsDataPayload = { 
                code: newsCode,
                newsCode: newsCode,
                category: cat, 
                title: title, 
                newsTitle: title,
                imageUrl: imageUrl,
                image: imageUrl,
                duplicateImage: duplicateImage,
                duplicateImageInArticle: duplicateImage,
                duplicateCoverInArticle: duplicateImage,
                videoUrl: videoUrl,
                youtubeUrl: videoUrl,
                youtubeId: youtubeId,
                content: message, 
                message: message,
                link: redirectUrl,
                redirectUrl: redirectUrl,
                buttonLabel: buttonLabel,
                actionButtonLabel: buttonLabel,
                updatedAt: nowEpoch,
                timestamp: nowEpoch,
                date: timestampFormatted
            };

            try {
                if (currentEditingKey) {
                    await update(ref(db, `${currentEditingNode}/${currentEditingKey}`), newsDataPayload);
                    triggerAdminAlert(`Updated [${newsCode}] in ${currentEditingNode}!`);
                } else {
                    newsDataPayload.createdAtTimestamp = nowEpoch;
                    await set(push(ref(db, 'shikelaNews')), newsDataPayload);
                    triggerAdminAlert(`Published to shikelaNews! Code: [${newsCode}]`);
                }

                resetFormState();

            } catch (err) {
                console.error("Database Save Error:", err);
                triggerAdminAlert("Database save failed: " + err.message, false);
            } finally {
                publishBtn.disabled = false;
            }
        });

        // Purge Action
        document.getElementById('deleteAllCategoriesBtn').addEventListener('click', async () => {
            if(!await openModal("CRITICAL PURGE", "Permanently delete ALL news entries across database?", [{label:"Target Nodes:", value:"shikelaNews, newNews"}], "btn-delete", "Delete Everything")) return;
            try {
                await remove(ref(db, 'shikelaNews')); 
                await remove(ref(db, 'newNews')); 
                resetFormState();
                triggerAdminAlert("Flushed all news items!");
            } catch(e) {
                triggerAdminAlert("Purge failed: " + e.message, false);
            }
        });
    </script>
</body>
</html>
