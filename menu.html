<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Force all menu links to open in the full window -->
    <base target="_top">

    <title>Shikela - Navigation Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="news.css">
    <style>
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
            padding: 0 10px;
        }

        /* 3D Dark Blur Card Styling */
        .menu-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px 22px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .menu-card:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.85);
        }

        .menu-card-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            stroke: #38bdf8;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(56, 189, 248, 0.3));
        }

        .menu-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .chevron-icon {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 2.5;
            fill: none;
        }
    </style>
</head>
<body>

    <div class="app-view">
        <!-- Top Wave Background -->
        <svg class="bg-wave bg-wave-top" viewBox="0 0 375 200" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0H375V75C375 75 280 155 0 95V0Z" fill="url(#paint0_linear)"/>
            <defs>
                <linearGradient id="paint0_linear" x1="187.5" y1="0" x2="187.5" y2="200" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#081B38"/>
                    <stop offset="1" stop-color="#0F2C59"/>
                </linearGradient>
            </defs>
        </svg>

        <!-- Navigation Header (Timer Removed) -->
        <header class="nav-header">
            <div class="header-left-group">
                <h1 class="header-title-text" style="font-size: 22px; font-weight: 800;">Menu</h1>
            </div>
        </header>

        <main class="app-content">
            <!-- Information Links Section -->
            <div class="menu-grid">
                
                <!-- Terms & Conditions -->
                <a href="terms.html" class="menu-card">
                    <div class="menu-card-left">
                        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span class="menu-title">Terms & Conditions</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <!-- Privacy Policy -->
                <a href="privacy.html" class="menu-card">
                    <div class="menu-card-left">
                        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <span class="menu-title">Privacy Policy</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <!-- About Us -->
                <a href="about.html" class="menu-card">
                    <div class="menu-card-left">
                        <svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span class="menu-title">About Us</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <!-- Contact Us -->
                <a href="contact.html" class="menu-card">
                    <div class="menu-card-left">
                        <svg class="menu-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <span class="menu-title">Contact Us</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

            </div>

            <footer class="verified-footer-shield" style="margin-top: 40px; margin-bottom: 20px;">
                <span class="footer-shield-text">Shikela Secure Matrix Verified</span>
            </footer>
        </main>
    </div>

</body>
</html>
